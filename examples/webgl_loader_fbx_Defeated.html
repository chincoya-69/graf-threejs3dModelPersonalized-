<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js - Defeated</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="info">
        <strong>Three.js - FBXLoader</strong><br>
        Modelo: Defeated<br>
        Animación FBX de Mixamo
    </div>
    <div id="loading">Cargando modelo 3D...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "../build/three.module.js",
                "three/addons/": "./jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        const MODEL_FILE = "Defeated.fbx";
        const MODEL_COLOR = 0xe74c3c;

        let camera, scene, renderer, controls, mixer;
        const clock = new THREE.Clock();
        const loadingElement = document.getElementById('loading');

        init();
        loadModel();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x20232b);
            scene.fog = new THREE.Fog(0x20232b, 800, 3000);

            camera = new THREE.PerspectiveCamera(
                45, window.innerWidth / window.innerHeight, 0.1, 10000
            );
            camera.position.set(250, 250, 500);

            // Iluminación ambiental y luz superior.
            const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444455, 2.0);
            scene.add(hemisphereLight);

            const topLight = new THREE.DirectionalLight(0xffffff, 3.0);
            topLight.position.set(0, 600, 250);
            topLight.castShadow = true;
            scene.add(topLight);

            const fillLight = new THREE.PointLight(0xffffff, 1.2);
            fillLight.position.set(-300, 250, -250);
            scene.add(fillLight);

            // Piso y cuadrícula para dar referencia de escala.
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(2000, 2000),
                new THREE.MeshPhongMaterial({ color: 0x555963, shininess: 35 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.5;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(2000, 40, 0x9da3ad, 0x555963);
            grid.position.y = 0;
            scene.add(grid);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 100, 0);
            controls.update();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        function loadModel() {
            const loader = new FBXLoader();

            loader.load(
                'models/fbx/' + encodeURIComponent(MODEL_FILE),
                (object) => {
                    // Centra el modelo y lo coloca sobre el piso.
                    const initialBox = new THREE.Box3().setFromObject(object);
                    const initialSize = initialBox.getSize(new THREE.Vector3());
                    const initialCenter = initialBox.getCenter(new THREE.Vector3());

                    object.position.x -= initialCenter.x;
                    object.position.z -= initialCenter.z;
                    object.position.y -= initialBox.min.y;

                    // Material brillante con un color distinto para cada modelo.
                    object.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;

                            const oldMaterials = Array.isArray(child.material)
                                ? child.material
                                : [child.material];

                            const newMaterials = oldMaterials.map((oldMaterial) => {
                                const material = new THREE.MeshPhongMaterial({
                                    color: MODEL_COLOR,
                                    map: oldMaterial && oldMaterial.map ? oldMaterial.map : null,
                                    shininess: 85,
                                    specular: 0x777777
                                });

                                if (oldMaterial && oldMaterial.alphaMap) {
                                    material.alphaMap = oldMaterial.alphaMap;
                                }
                                if (oldMaterial && oldMaterial.transparent) {
                                    material.transparent = true;
                                    material.opacity = oldMaterial.opacity;
                                }
                                if (oldMaterial && oldMaterial.side !== undefined) {
                                    material.side = oldMaterial.side;
                                }
                                return material;
                            });

                            child.material = Array.isArray(child.material)
                                ? newMaterials
                                : newMaterials[0];
                        }
                    });

                    scene.add(object);

                    const box = new THREE.Box3().setFromObject(object);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());
                    const height = Math.max(size.y, 100);

                    controls.target.set(center.x, height * 0.5, center.z);
                    const distance = Math.max(height * 2.2, 250);
                    camera.position.set(distance * 0.65, height * 0.8, distance * 1.6);
                    camera.near = Math.max(height / 1000, 0.1);
                    camera.far = height * 100;
                    camera.updateProjectionMatrix();
                    controls.update();

                    // Reproduce automáticamente la primera animación incluida en el FBX.
                    if (object.animations && object.animations.length > 0) {
                        mixer = new THREE.AnimationMixer(object);
                        const action = mixer.clipAction(object.animations[0]);
                        action.reset();
                        action.play();
                    } else {
                        loadingElement.textContent =
                            'Modelo cargado. Este archivo no contiene animaciones.';
                        return;
                    }

                    loadingElement.style.display = 'none';
                },
                (xhr) => {
                    if (xhr.total) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingElement.textContent = 'Cargando modelo 3D... ' + percent + '%';
                    }
                },
                (error) => {
                    console.error('Error al cargar el FBX:', error);
                    loadingElement.textContent =
                        'No se pudo cargar el modelo. Revisa la ruta del archivo y ejecuta con un servidor local.';
                }
            );
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
